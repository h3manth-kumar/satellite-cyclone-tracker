# CycloneAI - Member 1 Default Service Configuration

service:
  name: "ml-detection"
  host: "0.0.0.0"
  port: 8001
  environment: "production"
  log_level: "info"

model:
  version: "v1.0.0"
  backbone: "CycloneBaselineCNN"
  weights_path: "artifacts/models/cyclone_baseline_v1.pth"
  device: "cpu" # "cpu" or "cuda"
  confidence_threshold: 0.5

preprocessing:
  image_size: [224, 224]
  channels: 3
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]

classes:
  - "No Cyclone / Non-Depression"
  - "Depression"
  - "Deep Depression"
  - "Cyclonic Storm"
  - "Severe Cyclonic Storm"
  - "Very Severe Cyclonic Storm"
  - "Extremely Severe Cyclonic Storm"
  - "Super Cyclonic Storm"
